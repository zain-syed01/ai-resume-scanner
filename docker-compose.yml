version: '3.8'

services:
  # 1. NEW: Streamlit Frontend Dashboard
  frontend:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - BACKEND_URL=${BACKEND_URL}
    depends_on:
      - web

  # 2. Our Backend API
  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/postgres
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - chroma

  # 3. Our Relational DB (Structured data: user logs, app status)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Our Vector DB (Unstructured data: Resume embeddings)
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"  # Mapped to 8001 on the host to avoid clashing with FastAPI
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  postgres_data:
  chroma_data:       # Persistent storage for vector embeddings